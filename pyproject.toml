[project]
name = "gihini-research"
version = "0.1.0"
description = "Gihini University Research & Survey Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "certifi==2026.4.22",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "cryptography==47.0.0",
    "Django==6.0.4",
    "django-allauth==65.16.1",
    "idna==3.13",
    "numpy==2.4.4",
    "pillow==12.2.0",
    "pycparser==3.0",
    "PyJWT==2.12.1",
    "requests==2.33.1",
    "sqlparse==0.5.5",
    "tzdata==2026.2",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
mysql = ["mysqlclient==2.3.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
